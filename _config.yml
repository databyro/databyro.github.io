# Databyro – Jekyll configuration (GitHub Pages)
# Changes here need a site rebuild; GitHub Pages does that on every push.

# Site settings
title: Databyro
description: Suomalaisen politiikan tilastoihin keskittyvä, vapaaehtoisvoimin pyörivä sivusto.
locale: fi
minimal_mistakes_skin: "contrast"
search: false
atom_feed:
  hide: true

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
timezone: Europe/Helsinki

include:
  - _pages

exclude:
  - CNAME # GitHub Pages excludes this by default; a custom list must repeat it
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

plugins:
  - jekyll-sitemap
  - jekyll-include-cache

footer:
  links:
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/DatabyroFI"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/databyro"

defaults:
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
